[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-hunter"
version = "0.2.0"
description = "Bulk download academic papers (PDFs) from a list of DOIs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rasoul Norouzi" }]
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "pandas",
    "nodriver",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
notebook = ["jupyter", "openpyxl"]
test = ["pytest", "httpx2"]

[project.urls]
Homepage = "https://github.com/rasoulnorouzi/paper_hunter"

[project.scripts]
paper-hunter = "paper_hunter.cli:main"

[tool.setuptools]
packages = ["paper_hunter"]

[tool.setuptools.package-data]
paper_hunter = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
