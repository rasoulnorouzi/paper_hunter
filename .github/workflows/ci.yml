name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Install and test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package
        run: python -m pip install ".[test]"

      - name: Check the installed package
        shell: bash
        run: |
          paper-hunter --help
          paper-hunter download --help
          cd "$RUNNER_TEMP"   # make sure the installed copy is used, not the source folder
          python -c "
          import pathlib, paper_hunter
          static = pathlib.Path(paper_hunter.__file__).parent / 'static'
          files = {p.name for p in static.iterdir()}
          assert {'index.html', 'app.js', 'style.css'} <= files, files
          print('paper_hunter', paper_hunter.__version__, 'installed with', sorted(files))
          "

      - name: Run the tests
        run: python -m pytest -q

  one-click:
    name: One-click starter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Run the starter exactly as a user would, but without opening a browser.
      - name: Start Paper Hunter (Linux)
        if: runner.os == 'Linux'
        run: nohup ./start_linux.sh ui --no-open --port 8765 > starter.log 2>&1 < /dev/null &

      - name: Start Paper Hunter (macOS)
        if: runner.os == 'macOS'
        run: nohup ./start_macos.command ui --no-open --port 8765 > starter.log 2>&1 < /dev/null &

      - name: Start Paper Hunter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Start-Process -FilePath cmd.exe -WindowStyle Hidden
          -ArgumentList '/c', 'start_windows.bat ui --no-open --port 8765 > starter.log 2>&1 < NUL'

      - name: Wait for the web page and try the API
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8765/ > /dev/null; then
              echo "Paper Hunter answered after about $((i * 5)) seconds"
              break
            fi
            sleep 5
          done
          curl -sf http://127.0.0.1:8765/ | grep -q "<title>Paper Hunter</title>"
          curl -sf http://127.0.0.1:8765/api/info
          echo
          curl -sf -X POST http://127.0.0.1:8765/api/parse \
            -H "Content-Type: application/json" \
            -d '{"text": "10.1038/nphys1170\n\n   \nhttps://doi.org/10.1126/science.aba2420"}' | tee parse.json
          echo
          grep -q '"count":2' parse.json

      - name: Starter output
        if: always()
        shell: bash
        run: cat starter.log || true
